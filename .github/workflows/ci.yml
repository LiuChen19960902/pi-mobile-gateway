name: Gateway CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gateway-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gateway:
    name: Gateway checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install file finder
        run: |
          if ! command -v fd >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y fd-find
            mkdir -p "$RUNNER_TEMP/pi-mobile-bin"
            ln -s "$(command -v fdfind)" "$RUNNER_TEMP/pi-mobile-bin/fd"
            echo "$RUNNER_TEMP/pi-mobile-bin" >> "$GITHUB_PATH"
          fi
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: node --experimental-strip-types --test --test-concurrency=1 tests/*.test.ts
